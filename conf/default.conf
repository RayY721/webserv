# Example config: see docs/config.md for the decided syntax and defaults.
# Relative filesystem paths are based on this config file directory.
# Illustrative only: the parser and referenced files are not implemented yet.

server {
    listen 127.0.0.1:8080;
    root ../www/site-a;
    index index.html;
    error_page 404 ../www/errors/404.html;
    client_max_body_size 1048576;

    location / {
        methods GET;
        autoindex off;
    }

    location /uploads {
        methods GET POST DELETE;
        root ../www/uploads;
        upload_store ../www/uploads;
        autoindex on;
    }

    location /old {
        return 301 /new;
    }

    location /cgi-bin {
        methods GET POST;
        root ../cgi-bin;
        cgi .py /usr/bin/python3;
    }
}

server {
    listen 127.0.0.1:8081;
    root ../www/site-b;
    index index.html;
}
